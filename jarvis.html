<!DOCTYPE html>
<html>
<head>
    <title>JARVIS AI Assistant</title>

    <style>
        body {
            margin: 0;
            background: #050b14;
            color: #00eaff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 55px;
            text-shadow: 0 0 20px #00eaff;
        }

        #circle {
            width: 220px;
            height: 220px;
            margin: 40px auto;
            border: 5px solid #00eaff;
            border-radius: 50%;
            box-shadow: 0 0 40px #00eaff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        button {
            padding: 15px 30px;
            margin: 10px;
            border: 2px solid #00eaff;
            background: transparent;
            color: #00eaff;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #00eaff;
            color: #000;
            box-shadow: 0 0 20px #00eaff;
        }

        #output {
            margin: 30px auto;
            width: 80%;
            min-height: 60px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>J.A.R.V.I.S</h1>

    <div id="circle">
        AI
    </div>

    <button onclick="startListening()">🎤 Talk to JARVIS</button>

    <button onclick="speak('Hello Sir. How can I help you?')">
        🔊 Test Voice
    </button>

    <div id="output">
        System Ready...
    </div>

<script>

const output = document.getElementById("output");

function speak(text) {
    output.innerHTML = "JARVIS: " + text;

    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        speak("Sorry Sir, your browser does not support voice recognition.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.start();

    output.innerHTML = "Listening...";

    recognition.onresult = function(event) {

        let command =
            event.results[0][0].transcript.toLowerCase();

        output.innerHTML = "You: " + command;

        processCommand(command);
    };
}

function processCommand(command) {

    if (command.includes("hello") ||
        command.includes("hi")) {

        speak("Hello Sir. I am JARVIS.");
    }

    else if (command.includes("your name")) {

        speak("My name is JARVIS, your AI assistant.");
    }

    else if (command.includes("time")) {

        let time = new Date().toLocaleTimeString();

        speak("Sir, the current time is " + time);
    }

    else if (command.includes("date")) {

        let date = new Date().toLocaleDateString();

        speak("Today's date is " + date);
    }

    else if (command.includes("google")) {

        speak("Opening Google.");

        window.open(
            "https://www.google.com",
            "_blank"
        );
    }

    else if (command.includes("youtube")) {

        speak("Opening YouTube.");

        window.open(
            "https://www.youtube.com",
            "_blank"
        );
    }

    else if (command.includes("calculator")) {

        speak("Opening calculator.");

        window.open(
            "https://www.google.com/search?q=calculator",
            "_blank"
        );
    }

    else if (command.includes("thank you")) {

        speak("You're welcome Sir.");
    }

    else {

        speak(
            "Sorry Sir, I don't understand that command yet."
        );
    }
}

</script>

</body>
</html>
